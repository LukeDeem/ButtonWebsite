<!DOCTYPE html>
<html>
<head>
    <title>My Button Website</title>
    <meta charset="UTF-8">
    <style>
        .message-container{
            max-width:600px;
            margin:auto;
            text-align:left;
        }

        ol{
            padding-left:40px;
        }
    </style>
    <style>
#message{
    max-width:600px;
    margin:20px auto;
    text-align:left;
}

#message ol{
    padding-left:25px;
}
</style>
</head>
<body style="text-align:center; margin-top:100px; font-family:Arial;">

    <h1>CI/CD Demo - Updated!</h1>

    <button onclick="showMessage()" 
            style="padding:15px 30px; font-size:18px;">
        Useeeee Me!! ☺☻
    </button>

    <p id="message"></p>
    
<script>
function showMessage() {
    document.getElementById("message").innerHTML = `
        <h3>Deployed via CI/CD Pipeline!</h3>
        <p>Steps to manipulate this webpage:</p>
        <ol>
            <li>Open Git Bash in the file directory of your choice</li>
            <li>Run <code>git clone [url]</code> to clone the repository to your local machine</li>
            <li>Open the project in your code editor and modify the <code>index.html</code> file</li>
            <li>Run <code>git add .</code> to stage the changes</li>
            <li>Run <code>git commit -m "your message here"</code> to commit the changes</li>
            <li>Run <code>git push origin main</code> to push the changes to the remote repository</li>
            <li>Watch the CI/CD pipeline deploy your changes to the website</li>
        </ol>
    `;
}
</script>
</body>
</html>
