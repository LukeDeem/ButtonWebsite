<!DOCTYPE html>
<html>
<head>
    <title>My Button Website</title>
    <meta charset="UTF-8">
</head>
<body style="text-align:center; margin-top:100px; font-family:Arial;">

    <h1>CI/CD Demo - Updated!</h1>

    <button onclick="showMessage()" 
            style="padding:15px 30px; font-size:18px;">
        Useeeee Me!! ☺☻
    </button>

    <p id="message"></p>

    <script>
        function showMessage() {
            document.getElementById("message").innerText = 
                " Deployed via CI/CD Pipeline!";
                " steps to manipulate this webpage:";
                " 1.) open gitbash in the file directory of your choice ";
                " 2.) git clone [url] to clone the repository to your local machine ";
                " 3.) open the file in your code editor and make changes to the index.html file ";
                " 4.) git add . to stage the changes ";
                " 5.) git commit -m 'your message here' to commit the changes ";
                " 6.) git push origin main to push the changes to the remote repository ";
                " 7.) watch the CI/CD pipeline deploy your changes to the website! ";
        }
    </script>

</body>
</html>
